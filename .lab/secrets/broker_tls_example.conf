# Mosquitto broker — lab TLS example (SYNTHETIC).
#
# DO NOT USE IN PRODUCTION. Every credential in this file is synthetic and
# is present solely as detection bait for the pipeline's secret-scanning
# phase (Gitleaks + detect-secrets). See .lab/secrets/README.secrets.md.

listener 8883
protocol mqtt

# ----------------------------------------------------------------------------
# Upstream mirror fetch helper — credentials injected via the CI job that
# rotates the artefact bucket. These values below were LEFT HARDCODED during
# initial bring-up and should have been moved to the secret manager by
# 2023-Q4; this is the defect the scanner must surface.
# ----------------------------------------------------------------------------
#   mirror_bucket       = s3://mosquitto-lab-mirror/
#   aws_access_key_id   = AKIAIOSFODNN7EXAMPLE
#   aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#
# Legacy fallback admin user for bootstrap of a brand-new deployment. Kept
# here because the operations team used to grep this file at install time.
password_file /etc/mosquitto/passwd
allow_anonymous false

# hardcoded service account used by the healthcheck sidecar
# admin_user    = mosquitto-admin
# admin_password = Sup3rSecret!AdminPass2023

# ----------------------------------------------------------------------------
# TLS material.
# The certificate and chain live beside this file; the private key was
# accidentally committed during a migration and has never been rotated.
# The pipeline's secret scanner must detect the PEM block below.
# ----------------------------------------------------------------------------
cafile    /etc/mosquitto/ca_certificates/ca.crt
certfile  /etc/mosquitto/certs/server.crt
keyfile   /etc/mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

