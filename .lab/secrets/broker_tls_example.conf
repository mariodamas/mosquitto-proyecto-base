# Bridge to partner broker (synthetic)
connection  partner-bridge
address     partner.example.invalid:8883
topic       # in 0
remote_username partner-service
remote_password S3cret-Bridge-P@ss
bridge_cafile   /etc/mosquitto/ca_certificates/partner-ca.crt
bridge_insecure false
